name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make --keep-going lint test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
